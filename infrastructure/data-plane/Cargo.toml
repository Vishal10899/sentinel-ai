[package]
name = "sentinel-data-plane"
version = "2.0.0"
edition = "2021"
authors = ["Sentinel AI Engineering Team <engineering@sentinel.ai>"]
description = "Ultra-low latency Rust proxy and data plane for Sentinel AI Enterprise Control Infrastructure"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
hyper = { version = "1.3", features = ["full"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.6"
futures-util = "0.3"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
redis = { version = "0.25", features = ["tokio-comp", "aio"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "sentinel-data-plane"
path = "src/main.rs"
